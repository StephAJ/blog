# /etc/nginx/sites-available/blog.stephenarthur.org
#
#   sudo ln -s /etc/nginx/sites-available/blog.stephenarthur.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d blog.stephenarthur.org
#
# Certbot rewrites this file to add the TLS block and the port 80 redirect.

upstream blog_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limit for the write endpoints (comments, newsletter, login).
limit_req_zone $binary_remote_addr zone=blog_write:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name blog.stephenarthur.org;

    client_max_body_size 12M;

    # gzip; Next already sets long cache headers on immutable assets.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml image/svg+xml;

    # Long-lived hashed build assets.
    location /_next/static/ {
        proxy_pass http://blog_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Uploaded media — served straight off disk, skipping Node entirely.
    location /uploads/ {
        alias /var/www/blog/public/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        proxy_pass http://blog_upstream;
        access_log off;
    }

    # Throttle the public write endpoints.
    #
    # NOTE: /admin/login is deliberately NOT throttled here. It is driven by a
    # Next.js Server Action, and an nginx 503 mid-action surfaces in the browser
    # as "a client-side exception has occurred" rather than a useful error.
    # Login is already rate limited in the app (8 attempts per IP per 5 min).
    location ~ ^/api/(comments|subscribe) {
        limit_req zone=blog_write burst=10 nodelay;

        proxy_pass http://blog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://blog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Server Actions validate Origin against the forwarded host — both of
        # these must survive the proxy hop or every admin form fails.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
